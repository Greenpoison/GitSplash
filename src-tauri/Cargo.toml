[package]
name = "gitsplash"
version = "0.1.21"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
license-file = "../LICENSE"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitsplash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["process", "sync", "time", "rt-multi-thread"] }
tauri-plugin-dialog = "2.7.2"
dirs = "6.0.0"
zip = { version = "8.6.0", features = ["aes-crypto", "deflate"] }
walkdir = "2.5.0"
rand = { version = "0.10.2", features = ["std"] }
futures = "0.3.33"

# libsqlite3-sys 0.38.1 and rusqlite 0.40.1 both call the still-unstable
# `cfg_select!` macro with no `#![feature(...)]` gate to unlock it, so they
# fail to compile on any current stable rustc. Patched to the equivalent
# stable `#[cfg(...)]` form in vendor/ — see the comments there. Safe to
# drop this once upstream ships a fixed release.
[patch.crates-io]
libsqlite3-sys = { path = "vendor/libsqlite3-sys-0.38.1" }
rusqlite = { path = "vendor/rusqlite-0.40.1" }

